name: Release

# Started by hand (Actions → Release → Run workflow) with the version to
# publish. It publishes only when everything before it passes:
#   1. the version matches Cargo.toml, is on neither GitHub nor crates.io yet,
#      and the crate packages (`cargo publish --dry-run`);
#   2. CI passes: fmt, clippy, and the tests on every platform;
#   3. the `ratatoskr` command-line tool builds for every platform below.
# Then it publishes ratatoskr-web to crates.io, tags the tested commit
# v<version>, and publishes a GitHub release with the binaries and their
# SHA-256 checksums.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN: a crates.io API token
# with the publish-new and publish-update scopes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as in Cargo.toml (e.g. 0.1.0)"
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: v${{ inputs.version }}

jobs:
  check:
    name: check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The version is Cargo.toml's and is not released yet
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml says $declared, not ${{ inputs.version }}: bump it first"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          crate=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "ratatoskr release check" \
            "https://crates.io/api/v1/crates/$crate/${{ inputs.version }}")
          if [ "$status" = 200 ]; then
            echo "::error::$crate ${{ inputs.version }} is already on crates.io"; exit 1
          fi
      - name: The publishing token is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::set the CARGO_REGISTRY_TOKEN repository secret"; exit 1; }
      - name: Build tools (BoringSSL needs cmake and libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: The crate packages and builds as crates.io will
        run: cargo publish --dry-run --locked

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35), so the binaries run on older distributions too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz, experimental: false }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz, experimental: false }
          # As in CI: published when it builds, not yet required to.
          - { target: x86_64-pc-windows-msvc, os: windows-2025, archive: zip, experimental: true }
    steps:
      - uses: actions/checkout@v7
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo build --release --locked --bin ratatoskr
      - name: Package
        shell: bash
        run: |
          name="ratatoskr-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          bin=ratatoskr; [ "$RUNNER_OS" = Windows ] && bin=ratatoskr.exe
          cp "target/release/$bin" README.md LICENSE NOTICE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    name: publish to crates.io and GitHub
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Every required platform built
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            ls "$RUNNER_TEMP"/dist/*"$target"* >/dev/null 2>&1 || { echo "::error::no $target build"; exit 1; }
          done
      - name: Checksums
        run: cd "$RUNNER_TEMP/dist" && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Build tools (BoringSSL needs cmake and libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # crates.io first: a published version can never be replaced, so the
      # GitHub release (which can be redone) comes after it.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Tag the tested commit and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ratatoskr $TAG" --generate-notes ${{ inputs.prerelease && '--prerelease' || '' }}
