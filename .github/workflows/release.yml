name: Release

# Started by hand (Actions → Release → Run workflow) on main, with the
# version to publish. It publishes only when everything before it passes:
#   1. the version is a semantic version, not below Cargo.toml's, and on
#      neither GitHub nor crates.io yet;
#   2. it is written into Cargo.toml and Cargo.lock and committed to main as
#      haszerobyte ("Release <version>"; no commit when they already say it);
#   3. that commit packages (`cargo publish --dry-run`) and passes CI: fmt,
#      clippy, and the tests on every platform;
#   4. the `ratatoskr` command-line tool builds for every platform below;
#   5. the container image of the Linux binaries is pushed to
#      ghcr.io/haszerobyte/ratatoskr (<version>, and latest unless a pre-release).
# Then it publishes ratatoskr-web to crates.io, tags that commit
# v<version>, publishes a GitHub release with the binaries and their
# SHA-256 checksums, and updates the MCP Registry entry (packaging/mcp/server.json).
#
# Needs the repository secret CARGO_REGISTRY_TOKEN: a crates.io API token
# with the publish-new and publish-update scopes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1); written into Cargo.toml for you"
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: v${{ inputs.version }}

jobs:
  check:
    name: check and set the version
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The version is new and not below Cargo.toml's
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the release on main"; exit 1; }
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a version like 0.1.1"; exit 1
          fi
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          lowest=$(printf '%s\n%s\n' "$declared" "$VERSION" | sort -V | head -1)
          if [ "$lowest" != "$declared" ]; then
            echo "::error::$VERSION is below Cargo.toml's $declared"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          crate=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "ratatoskr release check" \
            "https://crates.io/api/v1/crates/$crate/$VERSION")
          if [ "$status" = 200 ]; then
            echo "::error::$crate $VERSION is already on crates.io"; exit 1
          fi
      - name: The publishing token is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::set the CARGO_REGISTRY_TOKEN repository secret"; exit 1; }
      - name: Write the version into Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          toml = open("Cargo.toml").read()
          # The package's own version: the first version line, in [package].
          toml = re.sub(r'^version = ".*"$', f'version = "{version}"', toml, count=1, flags=re.M)
          crate = re.search(r'^name = "(.*)"$', toml, flags=re.M).group(1)
          open("Cargo.toml", "w").write(toml)
          lock = open("Cargo.lock").read()
          # Its entry in Cargo.lock: the version line right after its name.
          lock, n = re.subn(rf'(^name = "{re.escape(crate)}"\nversion = )".*"$', rf'\1"{version}"', lock, count=1, flags=re.M)
          assert n == 1, f"no {crate} entry in Cargo.lock"
          open("Cargo.lock", "w").write(lock)
          PY
          git diff --stat
      - name: Build tools (BoringSSL needs cmake and libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: The crate packages and builds as crates.io will
        run: cargo publish --dry-run --locked --allow-dirty
      - name: Commit the version to main
        id: commit
        run: |
          if git diff --quiet; then
            echo "Cargo.toml already says ${{ inputs.version }}: nothing to commit"
          else
            git config user.name haszerobyte
            git config user.email thezeroday0x1@proton.me
            git commit -am "Release ${{ inputs.version }}"
            # Fails, and stops the release, if main moved since the run began.
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  build:
    name: build (${{ matrix.target }})
    needs: [check, ci]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35), so the binaries run on older distributions too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz, experimental: false }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz, experimental: false }
          # As in CI: published when it builds, not yet required to.
          - { target: x86_64-pc-windows-msvc, os: windows-2025, archive: zip, experimental: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo build --release --locked --bin ratatoskr
      - name: Package
        shell: bash
        run: |
          name="ratatoskr-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          bin=ratatoskr; [ "$RUNNER_OS" = Windows ] && bin=ratatoskr.exe
          cp "target/release/$bin" README.md LICENSE NOTICE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # The container image, from the Linux binaries just built and tested (no
  # second compile): linux/amd64 and linux/arm64. Before the crates.io publish,
  # so an image failure stops the release while nothing is out; a re-run
  # pushes the same tags again.
  image:
    name: container image (ghcr.io)
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: The Linux binaries, by Docker architecture
        run: |
          ctx="$RUNNER_TEMP/image"
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "$ctx/dist/$arch"
            tar xzf "$RUNNER_TEMP/dist/ratatoskr-$TAG-$target.tar.gz" -C "$RUNNER_TEMP"
            cp "$RUNNER_TEMP/ratatoskr-$TAG-$target/ratatoskr" "$ctx/dist/$arch/"
          done
          cp packaging/docker/Dockerfile.release "$ctx/Dockerfile"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/haszerobyte/ratatoskr:${{ inputs.version }}
            ${{ !inputs.prerelease && 'ghcr.io/haszerobyte/ratatoskr:latest' || '' }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}

  publish:
    name: publish to crates.io and GitHub
    needs: [check, build, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Every required platform built
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            ls "$RUNNER_TEMP"/dist/*"$target"* >/dev/null 2>&1 || { echo "::error::no $target build"; exit 1; }
          done
      - name: Checksums
        run: cd "$RUNNER_TEMP/dist" && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Build tools (BoringSSL needs cmake and libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # A published crates.io version can never be replaced, so everything that
      # can fail on GitHub's side is done first, as a draft (no tag yet, nothing
      # public): v0.1.0 reached crates.io and then its GitHub release was
      # refused (HTTP 403), leaving a version with no tag or binaries.
      # RELEASE_TOKEN, when set, is a fine-grained token with contents write on
      # this repository; the workflow's own token is the fallback.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --target "${{ needs.check.outputs.sha }}" \
            --title "ratatoskr $TAG" --generate-notes --draft ${{ inputs.prerelease && '--prerelease' || '' }}
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Tag the tested commit and publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The official MCP Registry entry (packaging/mcp/server.json), pointing at this version's
  # image. Its own job, after everything is published: a registry failure is
  # shown here and leaves the release itself complete. GitHub's OIDC token
  # proves the io.github.haszerobyte namespace; no secret is needed.
  registry:
    name: MCP Registry
    needs: [check, publish]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: server.json for this version
        working-directory: packaging/mcp
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].identifier = "ghcr.io/haszerobyte/ratatoskr:" + $v' \
            server.json > server.json.new && mv server.json.new server.json && cat server.json
      - name: mcp-publisher
        working-directory: packaging/mcp
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        working-directory: packaging/mcp
        run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
