name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks first and publishes only if they pass.
  workflow_call:
    inputs:
      ref:
        description: "The commit to check (the release's version commit)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Keyed by the workflow too: run inside a release, it is never cancelled by a push.
  # A pull request's newer push supersedes its older run. On main every commit
  # is checked to the end (its own group, by commit): a release is cut from
  # main, so each commit there must have a result, not a cancellation.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build tools (BoringSSL needs cmake and libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows is built and tested, but not yet required: BoringSSL's Windows
    # build (wreq's TLS) has not been verified on this crate.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86_64, os: ubuntu-24.04, experimental: false }
          - { name: linux aarch64, os: ubuntu-24.04-arm, experimental: false }
          # Apple Silicon runners are often unavailable ("capacity constraints"),
          # which left runs queued and then cancelled: the arm64 build is
          # cross-compiled on the Intel runner and checked, not run there.
          - { name: macos aarch64, os: macos-15-intel, experimental: false, target: aarch64-apple-darwin }
          - { name: macos x86_64, os: macos-15-intel, experimental: false }
          - { name: windows x86_64, os: windows-2025, experimental: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: Cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: cargo test --locked
        if: ${{ !matrix.target }}
        run: cargo test --locked
