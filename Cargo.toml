[package]
# "ratatoskr" is taken on crates.io; the library is still `ratatoskr` in code
# (`use ratatoskr::…`) and the binary is still `ratatoskr`.
name = "ratatoskr-web"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Web search and page fetching for LLM tools: a keyless meta-search (Bing, Yahoo, DuckDuckGo, Yandex, Wikipedia, Grokipedia) with news, images, videos and books, an SSRF-safe fetcher, and an MCP server"
repository = "https://github.com/haszerobyte/Ratatoskr"
homepage = "https://github.com/haszerobyte/Ratatoskr"
documentation = "https://docs.rs/ratatoskr-web"
readme = "README.md"
keywords = ["search", "web-fetch", "llm", "mcp", "agent"]
categories = ["web-programming::http-client", "text-processing", "command-line-utilities"]
# What crates.io gets: the source, its tests and fixtures, the README and docs/; not
# the workflows, the benchmark script or the logo.
include = ["src/**/*", "tests/**/*", "docs/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "ratatoskr"

[[bin]]
name = "ratatoskr"
path = "src/bin/ratatoskr.rs"

# `cargo binstall ratatoskr-web` downloads the release's prebuilt binary
# instead of building: building needs cmake and libclang (BoringSSL). The URL
# and layout are the release workflow's: ratatoskr-v<version>-<target>.tar.gz
# (.zip on Windows) holding ratatoskr-v<version>-<target>/ratatoskr.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ratatoskr-v{ version }-{ target }{ archive-suffix }"
bin-dir = "ratatoskr-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "cookies"] }
scraper = "0.29"
futures = "0.3"
# web_fetch reads PDFs (Anthropic's web_fetch returns them); text for the model.
pdf-extract = "0.12"
url = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
# The command line's logs, on stderr when RUST_LOG is set (src/bin/ratatoskr.rs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
# web_fetch presents as Chrome down to the TLS handshake: some sites (ESPNcricinfo)
# refuse any other fingerprint whatever the User-Agent. Only release candidates
# exist, so the versions are pinned. BoringSSL underneath: building needs cmake and libclang.
# Also the scraped engines' client (cookies, form, query).
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "gzip", "brotli", "deflate", "zstd", "stream", "cookies", "form", "query"] }
# emulation-compression: the browser's Accept-Encoding, not wreq's own.
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation", "emulation-compression"] }
# `ratatoskr serve`, the local HTTP API (http.rs): HTTP/1 on tokio, nothing more.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
axum = "0.8"

# A smaller, faster command-line tool and MCP server: whole-program
# optimisation and no symbols in the shipped binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
